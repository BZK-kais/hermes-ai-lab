[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-ai-lab"
version = "1.1.1"
description = "Shared local and remote AI Lab operations for Hermes, CLI, MCP and HTTP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28.1,<2"]
providers = ["huggingface-hub>=1.27,<2", "httpx>=0.27,<1", "boto3>=1.35,<2"]

[project.scripts]
ailab = "ai_lab_core.__main__:main"

[tool.setuptools.packages.find]
include = ["ai_lab_core*"]

[tool.setuptools.package-data]
ai_lab_core = ["recipes/*.json", "recipes/*.yaml", "recipes/*.yml", "assets/*.py", "assets/smoke-data/*.jsonl"]
