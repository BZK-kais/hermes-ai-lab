name: ai-lab
version: 1.1.1
requires_hermes: '>=0.23.1'
kind: standalone
description: A local AI lab for Hermes to prepare experiments, train, compare, qualify, share and use model configurations with rollback.
provides_tools:
  - ai_lab_status
  - ai_lab_list_local_models
  - ai_lab_hf_model_info
  - ai_lab_probe_endpoint
  - ai_lab_connections
  - ai_lab_connection_probe
  - ai_lab_operations
  - ai_lab_plan
  - ai_lab_run
  - ai_lab_job
  - ai_lab_provider_action
  - ai_lab_dataset_validate
  - ai_lab_artifact_inspect
  - ai_lab_generate
  - ai_lab_profile
  - ai_lab_experiment
  - ai_lab_analyze
  - ai_lab_benchmark
  - ai_lab_optimize
  - ai_lab_onboarding
  - ai_lab_mission
  - ai_lab_registry

# Optional secrets keep local-only use available without cloud accounts.
config_schema:
  runpod_api_key: {type: secret, env: AI_LAB_RUNPOD_API_KEY, description: Runpod API key for explicit provider actions}
  hf_token: {type: secret, env: AI_LAB_HF_TOKEN, description: Hugging Face token for explicit private jobs and transfers}
  inference_api_key: {type: secret, env: AI_LAB_INFERENCE_API_KEY, description: Bearer key for a configured inference endpoint}
  mcp_api_key: {type: secret, env: AI_LAB_MCP_API_KEY, description: Bearer key for a configured upstream MCP server}
  s3_access_key_id: {type: secret, env: AI_LAB_S3_ACCESS_KEY_ID, description: S3 access key ID}
  s3_secret_access_key: {type: secret, env: AI_LAB_S3_SECRET_ACCESS_KEY, description: S3 secret access key}
  s3_session_token: {type: secret, env: AI_LAB_S3_SESSION_TOKEN, description: Optional S3 session token}
  http_api_key: {type: secret, env: AI_LAB_HTTP_API_KEY, description: Bearer key protecting the optional loopback API}
optional_env:
  - name: AI_LAB_GOOGLE_CLIENT_ID
    description: Your Google OAuth client ID for optional GCS metadata access
    secret: false
  - name: AI_LAB_GOOGLE_CLIENT_SECRET
    description: Your Google OAuth client secret for optional GCS metadata access
    secret: true
oauth:
  - id: google
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes: [https://www.googleapis.com/auth/devstorage.read_only]
    client_id_env: AI_LAB_GOOGLE_CLIENT_ID
    client_secret_env: AI_LAB_GOOGLE_CLIENT_SECRET
    hosts: [storage.googleapis.com]
    authorize_params: {access_type: offline, prompt: consent}
